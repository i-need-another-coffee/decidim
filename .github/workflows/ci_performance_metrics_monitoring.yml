name: "[CI] Performance Metrics monitoring"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-api/**"
      - "decidim-core/**"
      - "decidim-dev/**"

env:
  CI: "true"
  SIMPLECOV: "true"
  RUBY_VERSION: 3.4.7
  NODE_VERSION: 22.14.0
  NODE_ENV: "test"
  RAILS_ENV: development
  RAILS_BOOST_PERFORMANCE: "true"
  SHAKAPACKER_RUNTIME_COMPILE: "false"
  DECIDIM_SPAM_DETECTION_BACKEND_RESOURCE: "memory"
  DECIDIM_SPAM_DETECTION_BACKEND_USER: "memory"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    name: Tests
    runs-on: ubuntu-22.04
    if: "!startsWith(github.head_ref, 'chore/l10n')"
    timeout-minutes: 60
    services:
      redis:
        image: redis@sha256:73dad4271642c5966db88db7a7585fae7cf10b685d1e48006f31e0294c29fdd7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:14@sha256:d508bf6220b5c7b7cd9c735d6abd5ea2e6e4e45882a29ed704f625aba32bd935
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          POSTGRES_PASSWORD: postgres
    env:
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_HOST: localhost
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
      - run: |
          sudo apt-get update && sudo apt-get install libvips libvips-tools
        name: Install libvips
        shell: "bash"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Get npm cache directory path
        id: npm-cache-dir-path
        run: echo "dir=$(npm get cache)-${{ env.DECIDIM_MODULE }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: npm-cache
        with:
          path: ${{ steps.npm-cache-dir-path.outputs.dir }}
          key: npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            npm-
      - run: bundle exec rake development_app
        name: Create development app
      - run: bundle exec rails assets:precompile
        name: Precompile assets
        working-directory: ./development_app/
      - run: bundle exec rails decidim:lighthouse:prepare_urls
        name: Setup lighthouse urls
        working-directory: ./development_app/
      - run: bundle exec rails dev:cache
        name: Activate Rails cache
        working-directory: ./development_app/
      - run: bundle exec rails server -b localhost -d
        name: Run Rails server
        working-directory: ./development_app/
      - run: bundle exec rails decidim:lighthouse:warmup
        name: Warmup the cache at the configured lighthouse urls
        working-directory: ./development_app/
      - name: Audit URLs using Lighthouse
        uses: treosh/lighthouse-ci-action@72f881228236981b625ed765b928efb1786a1f55 # v11
        with:
          runs: 3 # run more than once to warm up the application
          uploadArtifacts: true
          budgetPath: ./.github/workflows/lighthouse_budget.json # test performance budgets
          temporaryPublicStorage: true
