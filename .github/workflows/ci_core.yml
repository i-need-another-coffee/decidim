name: "[CI] Core"
on:
  push:
    branches:
      - develop
      - release/*
      - "*-stable"
  pull_request:
    branches-ignore:
      - "chore/l10n*"
    paths:
      - "*"
      - ".github/**"
      - "decidim-api/**"
      - "decidim-core/**"
      - "decidim-dev/**"
      - "packages/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  main:
    strategy:
      fail-fast: false
      matrix:
        test:
          - command: bundle exec parallel_split_test $(find spec -name "*_spec.rb" | grep -v "spec/lib/")
            name: "Lib specs"
          - command: bundle exec parallel_split_test $(find spec -name "*_spec.rb" | grep -v "spec/system/")
            name: "System specs"
          - command: bundle exec parallel_split_test $(find spec -name "*_spec.rb" | grep -v "spec/system/" | grep -v "spec/lib/" | grep -v "spec/lib/")
            name: "Tests without system, lib and tasks specs"
          - command: bundle exec parallel_split_test  $(find spec/tasks -name "*_spec.rb" | grep -v "shakapacker")
            name: "Tasks specs"
          - command: bundle exec parallel_split_test spec/tasks/decidim_tasks_shakapacker_spec.rb
            name: "Shakapacker tasks specs"
    name: ${{ matrix.test.name }}
    uses: ./.github/workflows/test_app.yml
    secrets: inherit
    with:
      working-directory: "decidim-core"
      test_command: ${{ matrix.test.command }}
      bullet_n_plus_one: false
      bullet_unused_eager_loading: false
