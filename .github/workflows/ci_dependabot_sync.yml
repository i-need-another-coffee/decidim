name: Sync Gemfile.lock files

permissions:
  contents: write

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'Gemfile.lock'

jobs:
  sync-lockfiles:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.ACTION_BACKPORTER_PAT }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: false

      - name: Install root dependencies
        run: bundle install

      - name: Update decidim-generators Gemfile.lock
        run: |
          cd decidim-generators
          bundle install

      - name: Commit changes
        run: |
          git config user.name "decidim-bot"
          git config user.email "101816158+greenwoodt@users.noreply.github.com"
          git add decidim-generators/Gemfile.lock
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync decidim-generators/Gemfile.lock"
            git push
          fi
